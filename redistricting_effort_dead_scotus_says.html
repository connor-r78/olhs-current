
<h2 class="sr-only">Interactive US map showing status of redistricting measures since the 2024 elections</h2>

<div style="padding: 1rem 0 0.5rem;">
  <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1rem; align-items:center;">
    <span style="font-size:13px; color:var(--color-text-secondary); margin-right:4px;">View:</span>
    <button id="btn-redistrict" onclick="setMode('redistrict')" style="font-size:13px; padding:4px 12px; border-radius:6px; border:1.5px solid #3B6D11; background:#EAF3DE; color:#3B6D11; cursor:pointer; font-weight:500;">Redistricting status</button>
    <button id="btn-swing" onclick="setMode('swing')" style="font-size:13px; padding:4px 12px; border-radius:6px; border:0.5px solid var(--color-border-secondary); background:transparent; color:var(--color-text-secondary); cursor:pointer;">Seat swing potential</button>
  </div>

  <div id="map" style="width:100%; position:relative;"></div>

  <div id="legend" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:0.75rem; font-size:12px; color:var(--color-text-secondary);"></div>

  <div id="tooltip" style="display:none; position:absolute; background:var(--color-background-primary); border:0.5px solid var(--color-border-secondary); border-radius:8px; padding:10px 14px; font-size:13px; pointer-events:none; max-width:220px; z-index:10; box-shadow:none;"></div>
</div>

<div id="detail-cards" style="display:none; margin-top:1rem; padding-top:1rem; border-top:0.5px solid var(--color-border-tertiary);">
  <p id="detail-name" style="font-size:16px; font-weight:500; margin:0 0 8px;"></p>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;" id="detail-grid"></div>
  <p id="detail-notes" style="font-size:13px; color:var(--color-text-secondary); margin:8px 0 0;"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const stateData = {
  "Alabama":      { redistrict: "none", swing: 0, seats: 7, dem: 1, rep: 6, notes: "New map pending legislative action (Louisiana v. Callais)" },
  "Alaska":       { redistrict: "none", swing: 0, seats: 1, dem: 0, rep: 1, notes: "" },
  "Arizona":      { redistrict: "none", swing: 0, seats: 9, dem: 4, rep: 5, notes: "" },
  "Arkansas":     { redistrict: "none", swing: 0, seats: 4, dem: 0, rep: 4, notes: "" },
  "California":   { redistrict: "gerrymander_d", swing: 5, seats: 52, dem: 40, rep: 12, notes: "Approved via referendum (Proposition 50)" },
  "Colorado":     { redistrict: "none", swing: 0, seats: 8, dem: 4, rep: 4, notes: "" },
  "Connecticut":  { redistrict: "none", swing: 0, seats: 5, dem: 5, rep: 0, notes: "" },
  "Delaware":     { redistrict: "none", swing: 0, seats: 1, dem: 1, rep: 0, notes: "" },
  "Florida":      { redistrict: "gerrymander_r", swing: -4, seats: 28, dem: 8, rep: 20, notes: "Bill signed by Gov. DeSantis" },
  "Georgia":      { redistrict: "none", swing: 0, seats: 14, dem: 5, rep: 9, notes: "" },
  "Hawaii":       { redistrict: "none", swing: 0, seats: 2, dem: 2, rep: 0, notes: "" },
  "Idaho":        { redistrict: "none", swing: 0, seats: 2, dem: 0, rep: 2, notes: "" },
  "Illinois":     { redistrict: "none", swing: 0, seats: 17, dem: 14, rep: 3, notes: "" },
  "Indiana":      { redistrict: "failed", swing: 0, seats: 9, dem: 2, rep: 7, notes: "Republican proposal rejected in state senate" },
  "Iowa":         { redistrict: "none", swing: 0, seats: 4, dem: 1, rep: 3, notes: "" },
  "Kansas":       { redistrict: "none", swing: 0, seats: 4, dem: 1, rep: 3, notes: "" },
  "Kentucky":     { redistrict: "none", swing: 0, seats: 6, dem: 1, rep: 5, notes: "" },
  "Louisiana":    { redistrict: "none", swing: 0, seats: 6, dem: 1, rep: 5, notes: "" },
  "Maine":        { redistrict: "none", swing: 0, seats: 2, dem: 1, rep: 1, notes: "" },
  "Maryland":     { redistrict: "none", swing: 0, seats: 8, dem: 7, rep: 1, notes: "Democratic bill left in committee by state senate" },
  "Massachusetts":{ redistrict: "none", swing: 0, seats: 9, dem: 9, rep: 0, notes: "" },
  "Michigan":     { redistrict: "none", swing: 0, seats: 13, dem: 7, rep: 6, notes: "" },
  "Minnesota":    { redistrict: "none", swing: 0, seats: 8, dem: 4, rep: 4, notes: "" },
  "Mississippi":  { redistrict: "none", swing: 0, seats: 4, dem: 1, rep: 3, notes: "" },
  "Missouri":     { redistrict: "gerrymander_r", swing: -1, seats: 8, dem: 1, rep: 7, notes: "Popular initative may prevent use of the map in 2026" },
  "Montana":      { redistrict: "none", swing: 0, seats: 2, dem: 0, rep: 2, notes: "" },
  "Nebraska":     { redistrict: "none", swing: 0, seats: 3, dem: 0, rep: 3, notes: "" },
  "Nevada":       { redistrict: "none", swing: 0, seats: 4, dem: 3, rep: 1, notes: "" },
  "New Hampshire":{ redistrict: "none", swing: 0, seats: 2, dem: 1, rep: 1, notes: "" },
  "New Jersey":   { redistrict: "none", swing: 0, seats: 12, dem: 10, rep: 2, notes: "" },
  "New Mexico":   { redistrict: "none", swing: 0, seats: 3, dem: 3, rep: 0, notes: "" },
  "New York":     { redistrict: "failed", swing: 0, seats: 26, dem: 15, rep: 11, notes: "SCOTUS blocked Democratic attempt" },
  "North Carolina":{ redistrict: "gerrymander_r", swing: -1, seats: 14, dem: 7, rep: 7, notes: "Allowed by federal judges" },
  "North Dakota": { redistrict: "none", swing: 0, seats: 1, dem: 0, rep: 1, notes: "" },
  "Ohio":         { redistrict: "commission", swing: -2, seats: 15, dem: 5, rep: 10, notes: "" },
  "Oklahoma":     { redistrict: "none", swing: 0, seats: 5, dem: 0, rep: 5, notes: "" },
  "Oregon":       { redistrict: "none", swing: 0, seats: 6, dem: 4, rep: 2, notes: "" },
  "Pennsylvania": { redistrict: "none", swing: 0, seats: 17, dem: 9, rep: 8, notes: "" },
  "Rhode Island": { redistrict: "none", swing: 0, seats: 2, dem: 2, rep: 0, notes: "" },
  "South Carolina":{ redistrict: "none", swing: 0, seats: 7, dem: 1, rep: 6, notes: "" },
  "South Dakota": { redistrict: "none", swing: 0, seats: 1, dem: 0, rep: 1, notes: "" },
  "Tennessee":    { redistrict: "gerrymander_r", swing: -1, seats: 9, dem: 2, rep: 7, notes: "Bill signed by Gov. Lee" },
  "Texas":        { redistrict: "gerrymander_r", swing: -5, seats: 38, dem: 13, rep: 25, notes: "" },
  "Utah":         { redistrict: "court", swing: 1, seats: 4, dem: 0, rep: 4, notes: "Appeals by GOP failed at U.S. federal court" },
  "Vermont":      { redistrict: "none", swing: 0, seats: 1, dem: 1, rep: 0, notes: "" },
  "Virginia":     { redistrict: "failed", swing: 0, seats: 11, dem: 5, rep: 6, notes: "Amendment ruled unconstitutional, appeals failed at SCOTUS" },
  "Washington":   { redistrict: "none", swing: 0, seats: 10, dem: 7, rep: 3, notes: "" },
  "West Virginia":{ redistrict: "none", swing: 0, seats: 2, dem: 0, rep: 2, notes: "" },
  "Wisconsin":    { redistrict: "none", swing: 0, seats: 8, dem: 3, rep: 5, notes: "" },
  "Wyoming":      { redistrict: "none", swing: 0, seats: 1, dem: 0, rep: 1, notes: "" }
};

const redistrictColors = {
  gerrymander_r: { fill: "#F7C1C1", stroke: "#A32D2D", label: "GOP gerrymander", text: "#791F1F" },
  gerrymander_d: { fill: "#B5D4F4", stroke: "#185FA5", label: "Dem gerrymander", text: "#0C447C" },
  court:         { fill: "#FAC775", stroke: "#854F0B", label: "Court-ordered map", text: "#633806" },
  commission:    { fill: "#ECFAE7", stroke: "185FA5", label: "Independent commision drew map", text: "0C447C" },
  failed:    { fill: "#303030", stroke: "#3B6D11", label: "Redistricting attempt failed", text: "#27500A" },
  none:   { fill: "#D3D1C7", stroke: "#5F5E5A", label: "No redistricting", text: "#444441" }
};

function swingColor(v) {
  if (v >= 2)  return { fill: "#B5D4F4", stroke: "#185FA5", text: "#0C447C" };
  if (v === 1) return { fill: "#E6F1FB", stroke: "#378ADD", text: "#185FA5" };
  if (v === 0) return { fill: "#D3D1C7", stroke: "#888780", text: "#444441" };
  if (v === -1)return { fill: "#FAECE7", stroke: "#993C1D", text: "#712B13" };
  return            { fill: "#F7C1C1", stroke: "#A32D2D", text: "#791F1F" };
}

let currentMode = "redistrict";
let selectedState = null;

function setMode(mode) {
  currentMode = mode;
  document.getElementById("btn-redistrict").style.cssText = mode === "redistrict"
    ? "font-size:13px;padding:4px 12px;border-radius:6px;border:1.5px solid #3B6D11;background:#EAF3DE;color:#3B6D11;cursor:pointer;font-weight:500;"
    : "font-size:13px;padding:4px 12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;";
  document.getElementById("btn-swing").style.cssText = mode === "swing"
    ? "font-size:13px;padding:4px 12px;border-radius:6px;border:1.5px solid #185FA5;background:#E6F1FB;color:#185FA5;cursor:pointer;font-weight:500;"
    : "font-size:13px;padding:4px 12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;";
  renderMap();
  renderLegend();
  if (selectedState) showDetail(selectedState);
}

function renderLegend() {
  const leg = document.getElementById("legend");
  leg.innerHTML = "";
  if (currentMode === "redistrict") {
    Object.entries(redistrictColors).forEach(([k, c]) => {
      leg.innerHTML += `<span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:${c.fill};border:1px solid ${c.stroke};display:inline-block;"></span><span>${c.label}</span></span>`;
    });
  } else {
    [
      { fill:"#B5D4F4", stroke:"#185FA5", label:"Gain 2+ Dem seats" },
      { fill:"#E6F1FB", stroke:"#378ADD", label:"Gain 1 Dem seat" },
      { fill:"#D3D1C7", stroke:"#888780", label:"No change" },
      { fill:"#FAECE7", stroke:"#993C1D", label:"Gain 1 GOP seat" },
      { fill:"#F7C1C1", stroke:"#A32D2D", label:"Gain 2+ GOP seats" }
    ].forEach(c => {
      leg.innerHTML += `<span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:${c.fill};border:1px solid ${c.stroke};display:inline-block;"></span><span>${c.label}</span></span>`;
    });
  }
}

function showDetail(name) {
  selectedState = name;
  const d = stateData[name];
  if (!d) return;
  const cards = document.getElementById("detail-cards");
  cards.style.display = "block";
  document.getElementById("detail-name").textContent = name;
  const pct = Math.round(d.dem / d.seats * 100);
  document.getElementById("detail-grid").innerHTML = `
    <div style="background:var(--color-background-secondary);border-radius:8px;padding:10px 12px;">
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">Total seats</div>
      <div style="font-size:20px;font-weight:500;">${d.seats}</div>
    </div>
    <div style="background:#E6F1FB;border-radius:8px;padding:10px 12px;">
      <div style="font-size:12px;color:#185FA5;margin-bottom:4px;">Dem seats</div>
      <div style="font-size:20px;font-weight:500;color:#0C447C;">${d.dem}</div>
    </div>
    <div style="background:#FAECE7;border-radius:8px;padding:10px 12px;">
      <div style="font-size:12px;color:#993C1D;margin-bottom:4px;">Rep seats</div>
      <div style="font-size:20px;font-weight:500;color:#712B13;">${d.rep}</div>
    </div>`;
  const swingLabel = d.swing > 0 ? `+${d.swing} Dem potential` : d.swing < 0 ? `${d.swing} Dem seats at risk` : "No expected swing";
  document.getElementById("detail-notes").innerHTML = `<strong>Redistricting:</strong> ${redistrictColors[d.redistrict]?.label ?? d.redistrict} &nbsp;·&nbsp; <strong>Swing:</strong> ${swingLabel}<br><span style="margin-top:4px;display:inline-block;">${d.notes}</span>`;
}

function renderMap() {
  const mapDiv = document.getElementById("map");
  mapDiv.innerHTML = "";
  const isDark = matchMedia("(prefers-color-scheme: dark)").matches;

  const svg = d3.select("#map").append("svg")
    .attr("viewBox", "0 0 960 560")
    .attr("width", "100%")
    .style("display", "block");

  const tooltip = document.getElementById("tooltip");
  const projection = d3.geoAlbersUsa().scale(1100).translate([480, 280]);
  const path = d3.geoPath(projection);

  d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
    const features = topojson.feature(us, us.objects.states).features;

    svg.selectAll("path")
      .data(features)
      .join("path")
      .attr("d", path)
      .attr("stroke", isDark ? "rgba(255,255,255,0.2)" : "#fff")
      .attr("stroke-width", 0.8)
      .attr("fill", d => {
        const name = d.properties.name;
        const info = stateData[name];
        if (!info) return "#ccc";
        if (currentMode === "redistrict") return redistrictColors[info.redistrict]?.fill ?? "#ccc";
        return swingColor(info.swing).fill;
      })
      .style("cursor", "pointer")
      .on("mouseover", function(event, d) {
        const name = d.properties.name;
        const info = stateData[name];
        if (!info) return;
        d3.select(this).attr("stroke-width", 2).attr("stroke", isDark ? "#fff" : "#333");
        const swingText = info.swing > 0 ? `+${info.swing} Dem` : info.swing < 0 ? `${info.swing} Dem` : "No swing";
        tooltip.style.display = "block";
        tooltip.innerHTML = `<strong style="font-size:14px;">${name}</strong><br><span style="color:var(--color-text-secondary);font-size:12px;">${redistrictColors[info.redistrict]?.label ?? ""}</span><br><span style="font-size:12px;">Seats: ${info.dem}D / ${info.rep}R &nbsp;·&nbsp; Swing: ${swingText}</span>`;
        const mapRect = mapDiv.getBoundingClientRect();
        const x = event.clientX - mapRect.left;
        const y = event.clientY - mapRect.top;
        tooltip.style.left = Math.min(x + 12, mapRect.width - 230) + "px";
        tooltip.style.top = Math.max(y - 10, 0) + "px";
      })
      .on("mouseout", function() {
        d3.select(this).attr("stroke-width", 0.8).attr("stroke", isDark ? "rgba(255,255,255,0.2)" : "#fff");
        tooltip.style.display = "none";
      })
      .on("click", function(event, d) {
        showDetail(d.properties.name);
      });
  });
}

renderMap();
renderLegend();
</script>
